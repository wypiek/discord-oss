name: Apps

on:
  push:
    tags: ["apps-v*"]
  pull_request:
    paths: ["apps/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --cwd apps/desktop --ignore-scripts
      - run: bun run --cwd apps/desktop typecheck
      - run: bun install --cwd apps/mobile
      - run: bun run --cwd apps/mobile typecheck

  desktop:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          sparse-checkout: apps
      - if: runner.os == 'Windows'
        name: Check out the apps folder
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git config core.protectNTFS false
          git config core.longpaths true
          git sparse-checkout set apps
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          ls apps/desktop/package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/apps-v* ]]; then echo "APP_VERSION=${GITHUB_REF_NAME#apps-v}" >> "$GITHUB_ENV"; else echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"; fi
      - run: bun install --cwd apps/desktop
      - run: bun run --cwd apps/desktop build
      - name: Build the installers
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--${{ matrix.platform }} --publish never "-c.extraMetadata.version=$APP_VERSION")
          if [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            if [ "${{ matrix.platform }}" = "mac" ]; then args+=("-c.mac.identity=-"); fi
          fi
          bunx electron-builder "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: discord-oss-${{ matrix.platform }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/apps-v* ]]; then echo "APP_VERSION=${GITHUB_REF_NAME#apps-v}" >> "$GITHUB_ENV"; else echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"; fi
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - run: bun install --cwd apps/mobile
      - run: bun run --cwd apps/mobile build
      - name: Copy the web assets into the Android project
        working-directory: apps/mobile
        run: bun --bun x cap sync android
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            password="$KEYSTORE_PASSWORD"
            alias="${KEY_ALIAS:-discord-oss}"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a one-off key and won't update an earlier install."
            password="$(openssl rand -hex 16)"
            alias="discord-oss"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass "$password" -keypass "$password" -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Discord OSS"
          fi
          echo "::add-mask::$password"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk "../release/Discord-OSS-${APP_VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: discord-oss-android
          path: apps/mobile/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/apps-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Discord OSS ${{ github.ref_name }}
          files: artifacts/*
