name: Desktop app

on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  package:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - if: runner.os != 'Windows'
        uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
      - if: runner.os == 'Windows'
        name: Check out the desktop folder
        shell: bash
        working-directory: .
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git config core.protectNTFS false
          git config core.longpaths true
          git sparse-checkout set desktop
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          ls desktop/Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo packager --release --target ${{ matrix.target }} --binaries-dir target/${{ matrix.target }}/release --formats ${{ matrix.formats }} --out-dir target/packages
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: oss-chat-${{ matrix.target }}
          path: |
            desktop/target/packages/*.dmg
            desktop/target/packages/*.exe
            desktop/target/packages/*.msi
            desktop/target/packages/*.deb
            desktop/target/packages/*.AppImage
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/target/packages/*.dmg
            desktop/target/packages/*.exe
            desktop/target/packages/*.msi
            desktop/target/packages/*.deb
            desktop/target/packages/*.AppImage

  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: android
      - run: cargo install cargo-apk --locked --version 0.10.0
      - name: Prepare the signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a one-off key and won't update an earlier install."
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass "$password" -keypass "$password" -alias oss-chat -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OSS Chat"
          fi
          echo "::add-mask::$password"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build the APK
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release --lib
          mkdir -p target/packages
          cp target/release/apk/oss-chat.apk "target/packages/oss-chat_${GITHUB_REF_NAME#desktop-v}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: oss-chat-android
          path: desktop/target/packages/*.apk
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: desktop/target/packages/*.apk
