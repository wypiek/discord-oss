name: Desktop app

on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  package:
    if: github.event_name != 'pull_request'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            formats: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cargo packager --release --target ${{ matrix.target }} --binaries-dir target/${{ matrix.target }}/release --formats ${{ matrix.formats }} --out-dir target/packages
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: oss-chat-${{ matrix.target }}
          path: |
            desktop/target/packages/*.dmg
            desktop/target/packages/*.exe
            desktop/target/packages/*.msi
            desktop/target/packages/*.deb
            desktop/target/packages/*.AppImage
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/target/packages/*.dmg
            desktop/target/packages/*.exe
            desktop/target/packages/*.msi
            desktop/target/packages/*.deb
            desktop/target/packages/*.AppImage
