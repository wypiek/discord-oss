<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https: http:; connect-src 'none'" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Discord OSS</title>
        <link rel="stylesheet" href="app.css" />
    </head>
    <body>
        <main class="card">
            <img class="logo" src="../resources/icon.png" alt="" width="72" height="72" />
            <h1>Choose an instance</h1>
            <p class="subtitle">Discord OSS connects to any Discord OSS server. Pick one you've used or add a new one.</p>
            <ul id="instances" class="instances" aria-label="Saved instances"></ul>
            <form id="connect" class="connect" autocomplete="off">
                <label for="address">Instance address</label>
                <div class="row">
                    <input id="address" name="address" type="text" inputmode="url" placeholder="chat.example.org" spellcheck="false" required />
                    <button id="submit" type="submit">Connect</button>
                </div>
                <p id="error" class="error" role="alert" hidden></p>
            </form>
        </main>
        <script src="../dist/pages/switcher.js"></script>
    </body>
</html>
