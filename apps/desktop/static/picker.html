<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:" />
        <title>Share your screen</title>
        <link rel="stylesheet" href="app.css" />
    </head>
    <body class="picker">
        <header>
            <h1>Share your screen</h1>
            <div class="tabs" role="tablist">
                <button type="button" role="tab" data-kind="screen" aria-selected="true">Screens</button>
                <button type="button" role="tab" data-kind="window" aria-selected="false">Applications</button>
            </div>
        </header>
        <ul id="sources" class="sources" aria-label="Screens and windows"></ul>
        <footer>
            <label id="audio-row" class="audio" hidden><input id="audio" type="checkbox" checked /> Share system audio</label>
            <span class="spacer"></span>
            <button id="cancel" type="button" class="secondary">Cancel</button>
            <button id="share" type="button" disabled>Go Live</button>
        </footer>
        <script src="../dist/pages/picker.js"></script>
    </body>
</html>
