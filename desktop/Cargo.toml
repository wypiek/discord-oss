[package]
name = "oss-chat"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Native desktop client for self-hosted chat instances"
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[dependencies]
slint = "1.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
keyring = "4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
dirs = "6"

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[package.metadata.packager]
product-name = "OSS Chat"
identifier = "io.github.wypiek.osschat"
category = "SocialNetworking"
description = "Native desktop client for self-hosted chat instances"
out-dir = "target/packages"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
binaries = [{ path = "oss-chat", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
