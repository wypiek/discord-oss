[package]
name = "oss-chat"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Native desktop client for self-hosted chat instances"
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[lib]
name = "oss_chat"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "oss-chat"
path = "src/main.rs"

[dependencies]
slint = "1.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
webbrowser = "1"
dirs = "6"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
keyring = "4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "charset", "http2"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[package.metadata.packager]
product-name = "OSS Chat"
identifier = "io.github.wypiek.osschat"
category = "SocialNetworking"
description = "Native desktop client for self-hosted chat instances"
out-dir = "target/packages"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
binaries = [{ path = "oss-chat", main = true }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.android]
package = "io.github.wypiek.osschat"
apk_name = "oss-chat"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "OSS Chat"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode"
launch_mode = "singleTop"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
